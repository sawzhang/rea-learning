name: Static analysis lab
on: [push, pull_request, workflow_dispatch]
jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm run setup
      - run: npm run lab
      - run: npm run lab:versions
      - run: npm run lab:semantics
      - run: npm run lab:runtime
      - run: npm run lab:coverage
      - run: npm run lab:merge
      - run: npm run lab:identity
      - run: npm run lab:migration
      - run: npm run lab:ast
      - run: npm run lab:fallthrough
      - run: npm run lab:exceptions
      - run: npm run lab:async
      - run: npm run lab:concurrency
      - run: npm run lab:cancellation
      - run: npm run lab:abort
      - run: npm run lab:composed
      - run: npm run lab:inflight
