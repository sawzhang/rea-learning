name: Static analysis lab
on: [push, pull_request, workflow_dispatch]
jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm run setup
      - run: npm run lab
      - run: npm run lab:versions
